[project]
name = "mads-dav-mel"
version = "0.1.0"
description = "Master of informatics ADS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1.8",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "jupyterlab>=4.3.6",
    "loguru>=0.7.3",
    "nbformat>=5.10.4",
    "numpy>=2.2.1",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
    "pyarrow>=18.1.0",
    "pydantic>=2.10.4",
    "scikit-learn>=1.6.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "wa-analyzer",
]

[tool.uv.sources]
wa-analyzer = { path = "libs/wa_analyzer-0.4.1-py3-none-any.whl" }

[dependency-groups]
dev = [
    "nbstripout>=0.8.1",
]
