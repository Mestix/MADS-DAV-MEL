pre-commit:
  parallel: true
  commands:
    clear-notebook-outputs:
      run: |
        find . -name "*.ipynb" -not -path "./.venv/*" -exec jupyter nbconvert --ClearOutputPreprocessor.enabled=True --inplace {} \;
    black:
      run: black . --check
    isort:
      run: isort . --check
    flake8:
      run: flake8 .
