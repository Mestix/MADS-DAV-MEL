pre-commit:
  parallel: true
  commands:
    notebook-clean-check:
      run: |
        FILES=$(find . -name "*.ipynb" -not -path "./.venv/*")
        if [ -n "$FILES" ]; then
          echo "$FILES" | xargs -n 1 nbstripout --check
        fi
    black:
      run: black . --check
    isort:
      run: isort . --check
    flake8:
      run: flake8 .