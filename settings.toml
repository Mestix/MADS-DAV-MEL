[preprocessing]
start_date = "2023-09-01"

enabled_steps = [
  "clean_authors",
  "anonymize_authors",
  "add_message_length",
  "add_author_info",
  "filter_automatic_messages",
  "filter_messages_after_start_date",
  "set_has_emoji",
  "set_is_carnaval"
]

[preprocessing.auto_messages]
keywords = [
  "afbeelding weggelaten",
  "media weggelaten",
  "document weggelaten",
  "oproep gemist",
  "bericht is verwijderd",
  "video weggelaten",
  "audio weggelaten"
]

[preprocessing.carnaval]
"2024" = ["2024-02-08", "2024-02-15"]
"2025" = ["2025-02-27", "2025-03-04"]

[preprocessing.columns]
author = "author"
message = "message"
timestamp = "timestamp"
emoji_count = "emoji_count"
message_length = "message_length"
is_carnaval = "is_carnaval"
date = "date"

[les2]
columns = { author = "author", message = "message" }
highlight_users = { me = "laughing-cat", inlaw = "decorated-shark" }
output_image = "les2_meeste_vragen_gesteld.png"

[les2.annotation]
user = "decorated-shark"
text = """Mijn schoonmoeder:
"Wie komt er eten?" =P"""

[les2.plot]
colors = { me = "red", inlaw = "blue", other = "grey" }
annotation = { arrow_color = "blue" }
xlabel = "Aantal Vragen"
ylabel = "Gebruiker"
title = "Deze groepsleden stellen de meeste vragen"
legend_labels = { me = "Ik", inlaw = "Mijn Schoonmoeder", other = "Overige groepsleden" }

[les3.output_files]
weekly = "les3_weekactiviteit.png"
detail = "les3_2weken_detail.png"

[les5.columns]
author = "author"
emoji_count = "emoji_count"
message_length = "message_length"
age = "age"
gender = "gender"
is_inlaw = "is_inlaw"
is_carnaval = "is_carnaval"
timestamp = "timestamp"

[les5.output_files]
correlation = "les5_correlaties.png"
carnaval_relation = "les5_carnaval_vs_aangetrouwd.png"

[les6]
chunk_size = 200
min_chunks = 20
perplexity = 30
highlight_author = "sprightly-rhinoceros" 

[les6.output_files]
pca = "les6_pca_visualisatie.png"
tsne = "les6_tsne_visualisatie.png"

[plot]
figsize = [8, 5]
style = "whitegrid"
palette = "tab10"
grid = true
context = "notebook"
title_size = 14
label_size = 12
tick_size = 10
legend_size = 10